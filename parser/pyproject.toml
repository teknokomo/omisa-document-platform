[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "omisa-parser-stage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "defusedxml==0.7.1", "odfpy==1.4.1", "openpyxl==3.1.5",
  "PyMuPDF==1.28.2", "python-docx==1.2.0", "python-pptx==1.0.2",
  "striprtf==0.0.33",
]

[project.scripts]
omisa-document-breakglass = "omisa_parser.breakglass:main"

[project.optional-dependencies]
test = ["jsonschema==4.25.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["omisa_parser*"]
namespaces = false

[tool.setuptools.package-data]
omisa_parser = ["schemas/*.json"]
